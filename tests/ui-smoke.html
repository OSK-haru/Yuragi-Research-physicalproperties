<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI smoke test</title>
<style>body{font:13px/1.5 monospace;background:#111;color:#ddd;margin:16px} iframe{width:1400px;height:900px;border:1px solid #444} .bad{color:#f88} .ok{color:#8f8}</style>
</head>
<body>
<!-- Drives every view of the app through its controls and reports uncaught errors.
     Needs http (run `python launch.py --no-open --port 8765` and open /tests/ui-smoke.html). -->
<pre id="log">running…</pre>
<iframe id="app" src="../index.html"></iframe>
<script>
(async function () {
  const log = document.getElementById('log');
  const frame = document.getElementById('app');
  const lines = [];
  const errors = [];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  await new Promise((r) => { if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.contentWindow.YR) r(); else frame.addEventListener('load', r); });
  const win = frame.contentWindow, doc = frame.contentDocument, YR = win.YR;
  let where = 'boot';
  win.addEventListener('error', (e) => errors.push(where + ': ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  win.addEventListener('unhandledrejection', (e) => errors.push(where + ': ' + e.reason));

  const fire = (el, type, init) => el.dispatchEvent(new win.Event(type, Object.assign({ bubbles: true }, init || {})));
  const setRange = (input, value) => { input.value = value; fire(input, 'input'); fire(input, 'change'); };
  const click = (el) => el.dispatchEvent(new win.MouseEvent('click', { bubbles: true, clientX: 5, clientY: 5 }));
  const main = () => doc.getElementById('main');

  function exercise() {
    let n = 0;
    for (const input of Array.from(main().querySelectorAll('input[type=range]'))) {
      if (!input.isConnected) continue;
      const lo = +input.min, hi = +input.max, start = input.value;
      setRange(input, lo); setRange(input, hi); setRange(input, start); n += 3;
    }
    for (const box of Array.from(main().querySelectorAll('input[type=checkbox]'))) { box.click(); box.click(); n += 2; }
    for (const row of Array.from(main().querySelectorAll('tr.pick'))) { click(row); n++; }
    for (const sel of Array.from(main().querySelectorAll('select'))) {
      for (const opt of Array.from(sel.options)) { sel.value = opt.value; fire(sel, 'change'); n++; }
    }
    // buttons: re-query by index because clicking may rebuild parts of the view
    const count = main().querySelectorAll('button:not([data-go]):not([data-platform])').length;
    for (let i = 0; i < count; i++) {
      const b = main().querySelectorAll('button:not([data-go]):not([data-platform])')[i];
      if (b && !b.disabled && b.dataset.act !== 'send') { click(b); n++; }
    }
    return n;
  }
  function editors() {
    let n = 0;
    const tools = () => Array.from(main().querySelectorAll('.gate-btn'));
    for (let t = 0; t < tools().length; t++) {
      click(tools()[t]);
      for (const idx of [0, 1, 14, 3]) {
        const cell = main().querySelectorAll('.cell')[idx];
        if (cell) { click(cell); n++; }
      }
    }
    for (const inp of Array.from(main().querySelectorAll('.inp'))) { click(inp); n++; }
    for (let i = 0; i < 4; i++) { const inp = main().querySelectorAll('.inp')[0]; if (inp) { click(inp); n++; } }
    for (let i = 0; i < main().querySelectorAll('.mzi').length; i++) { click(main().querySelectorAll('.mzi')[i]); n++; }
    const qb = main().querySelector('.canvas-wrap .qb');
    if (qb) {
      const wrap = qb.closest('.canvas-wrap');
      const r = qb.getBoundingClientRect();
      const ev = (type, x, y) => { const e = new win.MouseEvent(type, { bubbles: true, clientX: x, clientY: y }); Object.defineProperty(e, 'pointerId', { value: 1 }); return e; };
      wrap.setPointerCapture = function () {};
      qb.dispatchEvent(ev('pointerdown', r.x + r.width / 2, r.y + r.height / 2));
      wrap.dispatchEvent(ev('pointermove', r.x + r.width / 2 + 40, r.y + r.height / 2 + 15));
      wrap.dispatchEvent(ev('pointerup', r.x + r.width / 2 + 40, r.y + r.height / 2 + 15));
      n += 3;
    }
    return n;
  }

  const views = ['overview', 'materials', 'device', 'layout', 'field', 'circuit', 'dynamics', 'extensions'];
  for (const lang of ['en', 'ja']) {
    for (const platform of ['sc', 'ph']) {
      YR.state.lang = lang; YR.state.platform = platform; YR.renderAll();
      for (const view of views) {
        where = lang + '/' + platform + '/' + view;
        const before = errors.length;
        let n = 0;
        try {
          YR.go(view); await sleep(30);
          n += exercise(); await sleep(30);
          n += editors(); await sleep(30);
          n += exercise();
        } catch (e) { errors.push(where + ': threw ' + (e && e.stack ? e.stack.split('\n').slice(0, 2).join(' | ') : e)); }
        const text = main().textContent;
        const empty = text.trim().length < 40;
        const leaks = /undefined|NaN|\[object/.test(text);
        if (empty) errors.push(where + ': view rendered empty');
        if (leaks) errors.push(where + ': text contains undefined/NaN/[object: ' + (text.match(/.{0,40}(undefined|NaN|\[object).{0,30}/) || [''])[0]);
        lines.push((errors.length === before ? 'ok   ' : 'FAIL ') + where + '  (' + n + ' actions)');
      }
    }
  }
  // cross-stage link: photonic layout -> circuit
  where = 'link/layout->circuit';
  try {
    YR.state.platform = 'ph'; YR.renderAll(); YR.go('layout'); await sleep(30);
    click(main().querySelector('.view-head .seg button')); await sleep(30);      // 4 modes
    click(main().querySelector('[data-act="send"]')); await sleep(30);
    if (YR.state.view !== 'circuit') errors.push(where + ': did not navigate');
    if (main().querySelectorAll('.inp').length !== 4) errors.push(where + ': expected 4 modes in the circuit');
    lines.push('ok   ' + where);
  } catch (e) { errors.push(where + ': threw ' + e); }

  log.className = errors.length ? 'bad' : 'ok';
  log.textContent = 'RESULT ' + (errors.length ? 'FAIL ' + errors.length : 'PASS') + '\n' + lines.join('\n') + (errors.length ? '\n\nERRORS\n' + errors.join('\n') : '');
  document.title = errors.length ? 'FAIL' : 'PASS';
})();
</script>
</body>
</html>
